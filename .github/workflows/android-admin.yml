name: Build HypeHub Admin APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Add Firebase configuration
        if: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 != '' }}
        env:
          FIREBASE_CONFIG_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$FIREBASE_CONFIG_BASE64" | base64 --decode > android/app/google-services.json

      - name: Sync Android project
        run: npm run android:sync

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: HypeHub-Admin-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
